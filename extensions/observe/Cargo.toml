[package]
name = "ranvier-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:url", "dep:opentelemetry"]

[dependencies]
opentelemetry-otlp = { version = "=0.32.0", optional = true, default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "=0.32.0", optional = true, default-features = false, features = ["trace", "metrics"] }

url = { version = "2", optional = true }

opentelemetry = { version = "=0.32.0", optional = true, default-features = false, features = ["trace"] }

[lints]
workspace = true
[dev-dependencies]
ranvier-core.workspace = true
ranvier-runtime.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "otlp_smoke"
required-features = ["otlp"]