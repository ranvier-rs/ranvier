name: Candidate API Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.ranvier-api-policy.json'
      - '.ranvier-observe-api-policy.json'
      - 'observe-api-surface-inventory.json'
      - 'api-surface-inventory.json'
      - 'api-stable-candidate-baseline.json'
      - 'scripts/api_surface_inventory.mjs'
      - 'scripts/candidate_api_*.mjs'
      - 'scripts/candidate_compile_contract.mjs'
      - '.github/workflows/api-compat.yml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.ranvier-api-policy.json'
      - '.ranvier-observe-api-policy.json'
      - 'observe-api-surface-inventory.json'
      - 'api-surface-inventory.json'
      - 'api-stable-candidate-baseline.json'
      - 'scripts/api_surface_inventory.mjs'
      - 'scripts/candidate_api_*.mjs'
      - 'scripts/candidate_compile_contract.mjs'
      - '.github/workflows/api-compat.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  optional-observe-api:
    name: Optional observe API inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: optional-observe-api-1.95.0
      - run: node scripts/api_surface_inventory.mjs --check --optional-observe

  candidate-api:
    name: Candidate API baseline and SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Rustdoc JSON is compiler-owned. Keep the API inventory on the exact
      # reviewed toolchain from .ranvier-api-policy.json; current stable is
      # covered independently by CI's cross-platform compile matrix.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-semver-checks --version 0.48.0 --locked
      - run: node scripts/api_surface_inventory.mjs --check
      - run: node scripts/candidate_api_baseline.mjs --check
      - run: node scripts/candidate_compile_contract.mjs
      - run: node scripts/candidate_api_semver.mjs
