[package]
name = "ranvier-macros"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for Ranvier transitions"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3.4"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
ranvier-core = { workspace = true, features = ["schema", "streaming"] }
trybuild = "1.0"

[features]
streaming = []

[lints]
workspace = true
