[package]
name = "ranvier-bench"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ranvier = { path = "../kit" }
ranvier-core = { workspace = true }
ranvier-runtime = { workspace = true }
ranvier-macros = { workspace = true }
ranvier-http = { workspace = true }
ranvier-inspector = { workspace = true }
ranvier-audit = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonwebtoken = "9"
async-trait = "0.1"
anyhow = { workspace = true }
http = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"
# Default features without http2: actix-http 3.x still uses h2 0.3 (RUSTSEC-2026-0258) for HTTP/2,
# and these HTTP/1.1 benchmark servers never negotiate it.
# Without cookies: actix-web 4.x pins cookie 0.16 (RUSTSEC-2026-0594), and the benchmarks use no cookies.
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "unicode", "compat", "ws"] }
actix-rt = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "axon_latency"
harness = false

[[bench]]
name = "http_throughput"
harness = false

[[bench]]
name = "bus_operations"
harness = false

[[bench]]
name = "transition_chain"
harness = false

[lints]
workspace = true
