[graph]
all-features = true

[advisories]
ignore = [
    # Approved 2026-11-23 (B7 design D1=a). chrono has no maintained release; it is a direct
    # dependency of ranvier-core, ranvier-audit and ranvier-compliance and DateTime<Utc> is part
    # of their public API, so replacing it is a breaking change planned as separate work.
    # Review by 2027-02-23.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; public API type in core/audit/compliance; replacement planned; review by 2027-02-23" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
